name: Bug report
description: Something isn't working — either in the metapackage's wiring or a sub-package
labels: ["bug"]
body:
  - type: dropdown
    id: scope
    attributes:
      label: Where's the problem?
      description: If you know it's in a sub-package, consider opening the issue in that repo directly instead.
      options:
        - search-toolkit itself (version constraints, metadata)
        - search-debug
        - search-ranking
        - search-ranking-optimizer
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: false
